.getpublish-io.ru/razbor/?utm_source=zapisi&utm_medium=page&utm_content=ai-zapis-1\">Записаться на разбор — 4 900 ₽</a><small>Разборы до 24 октября, по три в день. Не было полезно — вернём полностью. Карта не из России тоже проходит.</small></div>", "unes": "<section class=\"otz\" id=\"rec-voices\"><h2>Что люди унесли с разборов после эфиров</h2><p class=\"sub\">«Главный инсайт — доверие Георгию и команде. И необходимость практикума лично мне» — Валентина, 69 лет. «Идеи, до которых сама не додумалась» — Наталья В. «Спасибо за тёплое искреннее общение» — Лана П. За три недели разбор оплатили 21 человек, 10 уже прошли встречу, недовольных нет.</p></section>", "b": {"1": "<div class=\"day-bullets\"><h3>День 1 · Книга — что вы увидите и узнаете</h3><ul><li>Сайт книги, собранный за 40 минут прямо в эфире, и сайт-краудфандинг участницы из Харькова.</li><li>Что находит помощник-корректор в главе: 79 замечаний на полях, ни одного переписанного слова.</li><li>Иллюстрации к одной сцене в трёх стилях и как понять, какой ваш.</li><li>Перевод главы с озвучкой голосом автора.</li><li>«Библия книги»: что помощник должен помнить о рукописи, чтобы не переспрашивать «о чём книга».</li><li>Почему новичкам кажется, что нейросеть «врёт», и как выглядит работа, когда она помнит вас.</li></ul></div>", "2": "<div class=\"day-bullets\"><h3>День 2 · Жизнь — что вы увидите и узнаете</h3><ul><li>Досудебная претензия и договор за минуты — на живом примере из чата.</li><li>Сайт эксперта за 30 минут: что на нём должно быть, чтобы он приводил клиентов.</li><li>Посты из вашего опыта вашим голосом, которые не стыдно выложить.</li><li>Ответы на «я не технарь», «нет ноутбука», «а VPN?» — и что из этого делает за вас команда.</li><li>Какие дела по дому, семье и здоровью люди отдают помощнику первыми.</li><li>Чем система, которая помнит вас, отличается от чата, который всё забывает.</li></ul></div>", "3": "<div class=\"day-bullets\"><h3>День 3 · Доход — что вы увидите и узнаете</h3><ul><li>Нутрициолог MOON: приложение, которым пользуются клиенты, и что оно даёт эксперту.</li><li>Стилист, который помнит гардероб, и просьба из чата про психологию цвета.</li><li>Сценарная комната: как книга превращается в заявку для кино.</li><li>Юта для YouTube: помощник, который ведёт канал.</li><li>Ответ Георгия на «сколько стоит подписка на сценарную комнату» и «во сколько оцените заказ».</li><li>Как устроен разбор: час, карта проекта, честный ответ, гарантия возврата.</li></ul></div>"}, "d1": "<section class=\"otz\" id=\"rec-otz-day1\"><h2>Что говорят после разбора</h2><p class=\"sub\">Мария Х. — две минуты на камеру после разбора 17 октября. Наталья В. — сообщение после разбора 6 октября, как есть.</p><div class=\"rec-otz2\"><div class=\"rec-otz2-v\"><video controls playsinline preload=\"none\" poster=\"https://neiroseti.getpublish-io.ru/video/otzyv-razbor-2026-10-19.jpg\" aria-label=\"Видеоотзыв Марии Х. после разбора 17 октября: три книги, помощник астролога, совет идти в издательства\"><source src=\"https://neiroseti.getpublish-io.ru/video/otzyv-razbor-2026-10-19.mp4\" type=\"video/mp4\"></video><p class=\"vq\">«Георгий глубоко проникает, понимает наши боли и очень грамотно советует, что делать, чтобы получить нужный результат. Советую тем, кто застрял и не знает, куда идти: получить консультацию и начинать работать»<small>Мария Х., после разбора</small></p></div><figure class=\"rec-otz2-s\"><img src=\"https://neiroseti.getpublish-io.ru/img/otzyvy/otzyv-11.jpg\" alt=\"Отзыв Натальи после разбора: Георгий сразу уловил главное — столько идей, что одной жизни не хватит; после встречи определила программу-минимум; начинать нужно было ещё вчера\" loading=\"lazy\"></figure></div></section>"};
